services:
  - type: web
    name: kept-api
    runtime: python
    plan: free
    # Ohio, because the Neon project lives in aws-us-east-2. Putting the API in
    # another continent would add a round trip to every query on a 0.1 CPU box.
    region: ohio
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    # Free tier is 0.1 CPU / 512MB. A single worker is deliberate: extra workers
    # would multiply memory and database connections for no throughput gain.
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"

      # The Operator calls the mock task API over real HTTP rather than in
      # process, so it needs the service's own public URL.
      - key: SELF_BASE_URL
        fromService:
          type: web
          name: kept-api
          property: hostport
      - key: GIT_SHA
        fromService:
          type: web
          name: kept-api
          property: commitId

      # Groq's free tier allows 8000 tokens per minute and each extraction
      # brief is roughly 3500. Two at once fits; three does not.
      - key: ANALYST_CONCURRENCY
        value: "2"

      # Everything below is set in the Render dashboard, not in this file.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DEMO_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: INTERNAL_JOB_TOKEN
        sync: false
