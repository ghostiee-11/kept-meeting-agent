[project]
name = "kept-backend"
version = "0.1.0"
description = "Kept - multi-agent meeting-to-execution system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.13.0",
    "structlog>=25.4.0",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.44",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "pgvector>=0.5.0",
    "tenacity>=9.1.4",
    "langchain>=1.3.18",
    "langgraph>=1.2.11",
    "langchain-groq>=1.1.3",
    "langchain-google-genai>=4.3.7",
    "langchain-openai>=1.6.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langchain-tavily>=0.2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.14.0",
    "mypy>=1.18.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
# The folding table exists precisely to recognise curly quotes, en dashes, and
# non-breaking spaces, so flagging them as ambiguous is the lint misreading the
# intent rather than finding a problem.
"app/services/verifier.py" = ["RUF001"]
"tests/test_verifier.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers"
